# Builds the nftmail.box production image off the server and publishes it to GHCR.
#
# Why: the image used to be built on the 8 GB Hetzner box beside the live
# containers; an on-box `next build` OOM-killed dockerd on 2026-09-22 and took
# nftmail.box down. The server should only ever PULL.
#
# The image bakes only NEXT_PUBLIC_* values, which are public in every browser
# by definition. Runtime secrets stay in /opt/nftmail/.env and are injected by
# compose; nothing sensitive is in the image.
#
# Deploy (on the server):   cd /opt/nftmail && docker compose pull && docker compose up -d

name: Build and publish image

on:
  push:
    branches: [hetzner-live]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public values, safe to bake. Override in repo Variables if they change.
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || 'cmlw4x5gc02pt0bl77efz72xa' }}
            NEXT_PUBLIC_GNOSIS_RPC=${{ vars.NEXT_PUBLIC_GNOSIS_RPC || 'https://rpc.gnosischain.com' }}
            NEXT_PUBLIC_BASE_RPC=${{ vars.NEXT_PUBLIC_BASE_RPC || 'https://mainnet.base.org' }}
            NEXT_PUBLIC_WORKER_URL=${{ vars.NEXT_PUBLIC_WORKER_URL || 'https://worker.nftmail.box' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://nftmail.box' }}
            NEXT_PUBLIC_GHOSTAGENT_PROXY_URL=${{ vars.NEXT_PUBLIC_GHOSTAGENT_PROXY_URL || 'https://ghostagent-proxy.richard-159.workers.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
